<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rank Up</title>
<style>
:root{--sz:min(92vw,calc(100dvh - 240px),520px);--gap:calc(var(--sz)*.025);--cell:calc((var(--sz) - var(--gap)*5)/4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(110% 80% at 50% 0%,#3b4a2a,#12170c);color:#f1ead2;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
header{width:var(--sz);display:flex;align-items:center;gap:8px}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(26px,7vw,40px);letter-spacing:1px;color:#e9d48a;text-shadow:0 3px 0 #000;flex:1;line-height:1}
h1 small{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;letter-spacing:0;color:#c9c19c;font-weight:600;text-shadow:none;margin-top:3px}
.box{background:#00000040;border:1px solid #ffffff1c;border-radius:10px;padding:6px 10px;text-align:center;min-width:72px}
.box b{display:block;font-size:20px;color:#fff}
.box span{font-size:10px;letter-spacing:1px;opacity:.7;text-transform:uppercase}
#board{position:relative;width:var(--sz);height:var(--sz);background:#2a331c;border-radius:14px;padding:var(--gap);box-shadow:0 18px 50px #0009,inset 0 0 0 2px #ffffff12}
.cell{position:absolute;width:var(--cell);height:var(--cell);border-radius:10px;background:#ffffff0f;box-shadow:inset 0 2px 6px #0004}
.tile{position:absolute;width:var(--cell);height:var(--cell);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .11s ease-out;box-shadow:0 4px 0 #0006,inset 0 1px 0 #fff3;z-index:2}
.tile svg{width:58%;height:58%;filter:drop-shadow(0 2px 1px #0007)}
.tile .nm{font-weight:800;font-size:calc(var(--cell)*.12);line-height:1.05;text-align:center;padding:0 4px;text-shadow:0 1px 2px #0009;letter-spacing:.3px}
.tile.new{animation:appear .18s ease-out}
.tile.pop{animation:pop .2s ease-out}
.tile.pick{outline:4px dashed #ff6b5a;cursor:pointer;animation:wob .5s infinite}
@keyframes appear{from{transform:var(--t) scale(0)}to{transform:var(--t) scale(1)}}
@keyframes pop{0%{transform:var(--t) scale(1)}50%{transform:var(--t) scale(1.18)}100%{transform:var(--t) scale(1)}}
@keyframes wob{50%{transform:var(--t) rotate(3deg)}}
#powers{display:flex;gap:8px;width:var(--sz)}
.pw{flex:1;font:700 13px "Segoe UI",system-ui,sans-serif;color:#f1ead2;background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;padding:9px 6px;cursor:pointer;position:relative}
.pw:hover{background:#ffffff24}
.pw:disabled{opacity:.35;cursor:default}
.pw i{position:absolute;top:-7px;right:-5px;background:#e9b949;color:#2a1f05;font-style:normal;font-size:11px;border-radius:9px;padding:1px 6px}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-20px);background:linear-gradient(#e9d48a,#b8932f);color:#231a05;padding:12px 18px;border-radius:12px;font-weight:800;box-shadow:0 10px 30px #000a;opacity:0;transition:.3s;z-index:9;text-align:center;max-width:90vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-weight:600;font-size:13px;margin-top:2px}
.ov{position:fixed;inset:0;background:#0b0f07e6;display:flex;align-items:center;justify-content:center;z-index:8;padding:14px}
.ov.hide{display:none}
.card{background:linear-gradient(#303a20,#171d0e);border:2px solid #5d6b3a;border-radius:18px;padding:22px;width:min(420px,94vw);text-align:center;box-shadow:0 30px 80px #000;max-height:94vh;overflow:auto}
.card h2{font-family:Impact,"Arial Black",sans-serif;font-size:34px;color:#e9d48a;letter-spacing:1px}
.card p{opacity:.85;margin:6px 0 12px;font-size:14px}
.btn{font:800 16px "Segoe UI",system-ui,sans-serif;padding:12px 22px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(#e9d48a,#b8932f);color:#231a05;box-shadow:0 4px 0 #6a5414;margin:4px}
.btn.alt{background:#ffffff1c;color:#f1ead2;box-shadow:none;border:1px solid #ffffff30}
input{font:700 16px "Segoe UI",system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid #ffffff40;background:#0006;color:#fff;text-align:center;width:200px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;text-align:left}
td{padding:5px 4px;border-bottom:1px solid #ffffff14}
td:first-child{opacity:.6;width:24px}
.me{color:#ffe28a;font-weight:800}
#hint{font-size:12px;opacity:.6}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>RANK UP<small>Merge your way from Recruit to Field Marshal</small></h1>
  <div class="box"><span>Score</span><b id="score">0</b></div>
  <div class="box"><span>Best</span><b id="best">0</b></div>
 </header>
 <div id="board"></div>
 <div id="powers">
  <button class="pw" id="pUndo">↶ As You Were<i id="nUndo">0</i></button>
  <button class="pw" id="pDis">🗑 Discharge<i id="nDis">0</i></button>
  <button class="pw" id="pShuf">🔀 Re-form Ranks<i id="nShuf">0</i></button>
 </div>
 <div id="hint">Arrows / WASD / swipe. Every promotion earns you a power.</div>
</div>
<div id="toast"></div>
<div class="ov hide" id="over"><div class="card">
 <h2 id="oT">STAND DOWN</h2><p id="oS"></p>
 <div id="nameRow"><input id="nameIn" maxlength="14" placeholder="Your name"><br><button class="btn" id="saveB">Save score</button></div>
 <table id="hs"></table>
 <div style="margin-top:12px"><button class="btn" id="againB">New game</button></div>
</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const RANKS=[null,
 ['Recruit','No idea where the cookhouse is.'],
 ['Private','Has learned to make a bed. Badly.'],
 ['Lance Corporal','One stripe. Already unbearable.'],
 ['Corporal','Now legally allowed to shout at Lance Jacks.'],
 ['Sergeant','The moustache is now regulation.'],
 ['Staff Sergeant','Runs the stores. Owns your soul.'],
 ['Sergeant Major','Can hear a crooked beret from 300 metres.'],
 ['RSM','Even the officers salute him. Nervously.'],
 ['2nd Lieutenant','A Rupert! Has a map. Cannot read the map.'],
 ['Lieutenant','Still holding the map upside down.'],
 ['Captain','Has discovered the PowerPoint.'],
 ['Major','Says "jolly good" without irony.'],
 ['Lt Colonel','Commands a battalion of spreadsheets.'],
 ['Colonel','Hasn\'t carried his own bergen since 1998.'],
 ['Brigadier','His driver has a driver.'],
 ['Major General','Opens sentences with "In my day…"'],
 ['Lt General','Lunch is now a strategic objective.'],
 ['General','Owns more medals than shirts.'],
 ['Field Marshal','There is literally nobody left to salute you.']];
const COL=[null,['#8a8f6a','#5f6446'],['#7a8b52','#4f5e2e'],['#6a8a3a','#3f5a1c'],['#5a7a2c','#334c14'],['#4a6a28','#28420e'],['#3c5e3a','#1d3a1c'],['#2e5248','#133029'],['#1d4a52','#0b2a30'],['#5a2a3a','#33121d'],['#6a2434','#3c0e19'],['#7a1e2e','#470914'],['#283a6a','#111d40'],['#1e3076','#0c1848'],['#16287e','#081250'],['#4a1e6a','#260a3c'],['#6a1e5a','#3c0a32'],['#8a5a10','#4a2e04'],['#b07a10','#6a4404'],['#e0b020','#8a6406']];
const G='#f3d36b',GD='#8a6a1c';
function chevrons(n,y0=14){let s='';for(let i=0;i<n;i++){const y=y0+i*9;s+=`<path d="M10 ${y} L24 ${y+9} L38 ${y}" fill="none" stroke="${G}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}return s}
function crown(cx,cy,s=1){return `<g transform="translate(${cx} ${cy}) scale(${s})"><path d="M-10 6 L-10 -4 L-5 1 L0 -7 L5 1 L10 -4 L10 6 Z" fill="${G}" stroke="${GD}" stroke-width="1.5" stroke-linejoin="round"/><rect x="-10" y="6" width="20" height="3" rx="1" fill="${G}"/></g>`}
function pip(cx,cy,s=1){let p='';for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?4:9;p+=`${i?'L':'M'}${(cx+Math.cos(a)*r*s).toFixed(1)} ${(cy+Math.sin(a)*r*s).toFixed(1)} `}return `<path d="${p}Z" fill="${G}" stroke="${GD}" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="${2.6*s}" fill="#c33"/>`}
function swords(cx,cy){return `<g stroke="${G}" stroke-width="3.5" stroke-linecap="round"><line x1="${cx-11}" y1="${cy+9}" x2="${cx+11}" y2="${cy-9}"/><line x1="${cx+11}" y1="${cy+9}" x2="${cx-11}" y2="${cy-9}"/></g>`}
function wreath(cx,cy){return `<path d="M${cx-14} ${cy-6} A14 14 0 0 0 ${cx+14} ${cy-6}" fill="none" stroke="#6bbf59" stroke-width="4" stroke-dasharray="3 2"/>`}
function insignia(v){
 let s='';
 switch(v){
  case 1:s=`<circle cx="24" cy="20" r="8" fill="none" stroke="${G}" stroke-width="3"/><path d="M12 40 Q24 26 36 40" fill="none" stroke="${G}" stroke-width="3"/>`;break;
  case 2:s=`<path d="M10 30 Q24 8 38 30 Z" fill="${G}" stroke="${GD}" stroke-width="2"/><rect x="8" y="30" width="32" height="5" rx="2" fill="${G}"/>`;break;
  case 3:s=chevrons(1,18);break;case 4:s=chevrons(2,14);break;case 5:s=chevrons(3,10);break;
  case 6:s=crown(24,8,.8)+chevrons(3,18);break;
  case 7:s=crown(24,24,1.6);break;
  case 8:s=`<circle cx="24" cy="24" r="15" fill="none" stroke="${G}" stroke-width="3"/>`+crown(24,24,1.05);break;
  case 9:s=pip(24,24,1.5);break;case 10:s=pip(24,14,1.1)+pip(24,34,1.1);break;
  case 11:s=pip(24,9,.95)+pip(24,24,.95)+pip(24,39,.95);break;
  case 12:s=crown(24,24,1.6);break;case 13:s=crown(24,14,1.15)+pip(24,36,1);break;
  case 14:s=crown(24,10,1)+pip(24,27,.8)+pip(24,40,.8);break;
  case 15:s=crown(24,10,1)+pip(14,32,.75)+pip(24,40,.75)+pip(34,32,.75);break;
  case 16:s=pip(24,12,1)+swords(24,32);break;case 17:s=crown(24,12,1)+swords(24,32);break;
  case 18:s=crown(24,10,.9)+pip(24,24,.7)+swords(24,36);break;
  default:s=crown(24,12,1)+swords(24,30)+wreath(24,38);
 }
 return `<svg viewBox="0 0 48 48">${s}</svg>`;
}

// ---------- game ----------
let grid,tiles,score,bestRank,nextId=1,powers,undoState=null,busy=false,mode=null;
const board=$('board');
let best=LS.get('rankup_best',0);$('best').textContent=best.toLocaleString();
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className='cell';d.style.transform=`translate(${pos(c)},${pos(r)})`;board.appendChild(d)}
function pos(i){return `calc(${i} * (var(--cell) + var(--gap)))`}
function place(t){const tr=`translate(${pos(t.c)},${pos(t.r)})`;t.el.style.setProperty('--t',tr);t.el.style.transform=tr}
function paint(t){const[a,b]=COL[Math.min(t.v,19)];t.el.style.background=`linear-gradient(160deg,${a},${b})`;t.el.innerHTML=insignia(t.v)+`<div class="nm">${RANKS[Math.min(t.v,19)][0]}</div>`;t.el.style.color=t.v>=17?'#2a1a00':'#fff'}
function addTile(r,c,v,anim=true){const el=document.createElement('div');el.className='tile'+(anim?' new':'');const t={id:nextId++,r,c,v,el};paint(t);place(t);board.appendChild(el);el.onclick=()=>pickTile(t);grid[r][c]=t;return t}
function empties(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(){const e=empties();if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];addTile(r,c,Math.random()<.9?1:2)}
function newGame(){
 board.querySelectorAll('.tile').forEach(e=>e.remove());
 grid=[[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];
 score=0;bestRank=1;powers={undo:1,dis:0,shuf:0};undoState=null;mode=null;
 spawn();spawn();upd();$('over').classList.add('hide');saved=false;
}
function snapshot(){return{g:grid.map(row=>row.map(t=>t?t.v:0)),score,bestRank}}
function restore(s){board.querySelectorAll('.tile').forEach(e=>e.remove());grid=[[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(s.g[r][c])addTile(r,c,s.g[r][c],false);score=s.score;bestRank=s.bestRank;upd()}
function move(dir){
 if(busy||mode)return;
 const[dr,dc]=[[-1,0],[0,1],[1,0],[0,-1]][dir];
 const snap=snapshot();
 const rs=[0,1,2,3],cs=[0,1,2,3];if(dr===1)rs.reverse();if(dc===1)cs.reverse();
 let moved=false,gain=0,top=0;const merged=new Set(),dying=[];
 for(const r of rs)for(const c of cs){
  const t=grid[r][c];if(!t)continue;
  let nr=r,nc=c;
  while(true){const tr=nr+dr,tc=nc+dc;if(tr<0||tr>3||tc<0||tc>3||grid[tr][tc])break;nr=tr;nc=tc}
  const tr=nr+dr,tc=nc+dc,n=(tr>=0&&tr<=3&&tc>=0&&tc<=3)?grid[tr][tc]:null;
  if(n&&n.v===t.v&&!merged.has(n.id)&&t.v<19){
   grid[r][c]=null;t.r=tr;t.c=tc;place(t);dying.push(t);n.v++;merged.add(n.id);gain+=2**n.v;top=Math.max(top,n.v);moved=true;
  }else if(nr!==r||nc!==c){grid[r][c]=null;grid[nr][nc]=t;t.r=nr;t.c=nc;place(t);moved=true}
 }
 if(!moved){nudge(dir);return}
 undoState=snap;busy=true;
 setTimeout(()=>{
  dying.forEach(t=>t.el.remove());
  for(const row of grid)for(const t of row)if(t&&merged.has(t.id)){paint(t);t.el.classList.remove('pop','new');void t.el.offsetWidth;t.el.classList.add('pop')}
  score+=gain;if(gain)sfx(top);
  if(top>bestRank){bestRank=top;promote(top)}
  spawn();upd();busy=false;
  if(!canMove())gameOver();
 },115);
}
function nudge(dir){board.animate([{transform:'translate(0,0)'},{transform:`translate(${[0,4,0,-4][dir]}px,${[-4,0,4,0][dir]}px)`},{transform:'translate(0,0)'}],{duration:140})}
function canMove(){if(empties().length)return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=grid[r][c].v;if((c<3&&grid[r][c+1].v===v)||(r<3&&grid[r+1][c].v===v))return true}return false}
function promote(v){
 const reward=['undo','dis','shuf'][v%3];powers[reward]++;
 const nm={undo:'As You Were',dis:'Discharge',shuf:'Re-form Ranks'}[reward];
 toast(`PROMOTED: ${RANKS[v][0].toUpperCase()}`,`${RANKS[v][1]} (+1 ${nm})`);
 [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15),i*80));
}
function upd(){
 $('score').textContent=score.toLocaleString();if(score>best){best=score;LS.set('rankup_best',best);$('best').textContent=best.toLocaleString()}
 $('nUndo').textContent=powers.undo;$('nDis').textContent=powers.dis;$('nShuf').textContent=powers.shuf;
 $('pUndo').disabled=!powers.undo||!undoState;$('pDis').disabled=!powers.dis;$('pShuf').disabled=!powers.shuf;
}
let tT;function toast(a,b){const t=$('toast');t.innerHTML=a+(b?`<small>${b}</small>`:'');t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
$('pUndo').onclick=()=>{if(!powers.undo||!undoState||busy)return;powers.undo--;restore(undoState);undoState=null;upd();toast('AS YOU WERE!','Nobody saw that.');$('over').classList.add('hide')};
$('pShuf').onclick=()=>{if(!powers.shuf||busy)return;powers.shuf--;const vals=[];for(const row of grid)for(const t of row)if(t)vals.push(t.v);for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
 let k=0;for(const row of grid)for(const t of row)if(t){t.v=vals[k++];paint(t);t.el.classList.remove('pop');void t.el.offsetWidth;t.el.classList.add('pop')}undoState=null;upd();toast('RE-FORM RANKS!','Tallest on the right, shortest on the left.')};
$('pDis').onclick=()=>{if(!powers.dis||busy)return;if(mode){mode=null;board.querySelectorAll('.tile').forEach(e=>e.classList.remove('pick'));return}
 mode='dis';board.querySelectorAll('.tile').forEach(e=>e.classList.add('pick'));toast('DISCHARGE','Tap a tile to send them home.')};
function pickTile(t){if(mode!=='dis'||grid[t.r][t.c]!==t)return;mode=null;powers.dis--;grid[t.r][t.c]=null;t.el.animate([{opacity:1},{opacity:0,transform:t.el.style.transform+' scale(.2) rotate(40deg)'}],{duration:220}).onfinish=()=>t.el.remove();
 board.querySelectorAll('.tile').forEach(e=>e.classList.remove('pick'));undoState=null;tone(200,.2);upd();if(!empties().length&&!canMove())gameOver()}

// ---------- high scores ----------
let saved=false;
function gameOver(){
 $('oT').textContent=bestRank>=9?'COMMISSIONED & RETIRED':'STAND DOWN';
 $('oS').innerHTML=`Score <b>${score.toLocaleString()}</b> · Highest rank: <b>${RANKS[bestRank][0]}</b><br>${RANKS[bestRank][1]}`;
 $('nameIn').value=LS.get('arcade_name','');$('nameRow').style.display='';renderHS();$('over').classList.remove('hide');tone(160,.5,'sawtooth');
}
function renderHS(mark){const hs=LS.get('rankup_scores',[]);$('hs').innerHTML=hs.length?hs.map((h,i)=>`<tr class="${i===mark?'me':''}"><td>${i+1}</td><td>${esc(h.n)}</td><td>${h.s.toLocaleString()}</td><td>${RANKS[h.r][0]}</td></tr>`).join(''):'<tr><td></td><td>No scores yet. Be the first on parade.</td></tr>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('saveB').onclick=()=>{if(saved)return;saved=true;const n=($('nameIn').value.trim()||'Anon').slice(0,14);LS.set('arcade_name',n);const hs=LS.get('rankup_scores',[]);const e={n,s:score,r:bestRank,d:Date.now()};hs.push(e);hs.sort((a,b)=>b.s-a.s);const top=hs.slice(0,10);LS.set('rankup_scores',top);$('nameRow').style.display='none';renderHS(top.indexOf(e))};
$('againB').onclick=newGame;

// ---------- input & sound ----------
addEventListener('keydown',e=>{const k={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3}[e.code];if(k!=null&&$('over').classList.contains('hide')){e.preventDefault();move(k)}if(e.code==='KeyU')$('pUndo').click()});
let sx=0,sy=0,st=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=1});
addEventListener('pointerup',e=>{if(!st)return;st=0;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28||!$('over').classList.contains('hide'))return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))});
let AC=null;function tone(f,d=.1,type='triangle',v=.12){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function sfx(v){tone(220*Math.pow(1.12,v),.09)}
newGame();
</script>
</body>
</html>
