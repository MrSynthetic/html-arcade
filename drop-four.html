<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drop Four</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;background:linear-gradient(160deg,#2b1055,#7597de);background-attachment:fixed}
  #app{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;min-height:100vh;justify-content:center}
  h1{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:2px;text-shadow:0 4px 0 #0003}
  h1 .r{color:#ff5a7a}h1 .y{color:#ffd23f}
  #score{display:flex;align-items:stretch;gap:10px}
  .pl{display:flex;align-items:center;gap:10px;background:#ffffff1f;border:2px solid transparent;border-radius:14px;padding:8px 14px;backdrop-filter:blur(8px);min-width:150px;transition:all .2s}
  .pl.turn{border-color:#fff;box-shadow:0 0 22px #fff6;transform:translateY(-2px)}
  .disc{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 #0003,inset 0 3px 0 #fff5}
  .disc.r{background:#ff5a7a}.disc.y{background:#ffd23f}
  .pl .nm{font-weight:700;font-size:15px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .sc{font-size:26px;font-weight:900;margin-left:auto}
  .vs{align-self:center;font-weight:800;opacity:.7}
  canvas{touch-action:none;cursor:pointer;filter:drop-shadow(0 18px 30px #0006)}
  #msg{min-height:26px;font-weight:700;font-size:18px;text-align:center}
  .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font:700 14px "Segoe UI",sans-serif;padding:10px 16px;border-radius:30px;border:none;background:#ffffff26;color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
  button:hover{background:#ffffff40}
  button.pri{background:#fff;color:#2b1055}
  .modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;backdrop-filter:blur(4px)}
  .card{background:#24124a;border-radius:18px;padding:22px;width:min(460px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #0008}
  .card h2{text-align:center;margin-bottom:10px;font-size:26px}
  label{display:block;font-size:12px;opacity:.7;margin:10px 0 4px;letter-spacing:1px}
  input,select{width:100%;padding:9px;border-radius:10px;border:1px solid #ffffff33;background:#0003;color:#fff;font:15px "Segoe UI",sans-serif}
  option{background:#24124a}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:#0003;border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border-radius:8px;background:transparent}
  .seg button.on{background:#fff;color:#2b1055}
  .hidden{display:none!important}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
  th,td{padding:7px 5px;text-align:center;border-bottom:1px solid #ffffff14}
  th{font-size:11px;opacity:.6;letter-spacing:1px}
  td:nth-child(2){text-align:left;font-weight:600}
  .recent{font-size:13px;opacity:.85;margin-top:8px;max-height:150px;overflow-y:auto}
  .recent div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ffffff0d}
</style>
</head>
<body>
<div id="app">
  <h1><span class="r">DROP</span> <span class="y">FOUR</span></h1>
  <div id="score">
    <div class="pl" id="p0"><div class="disc r"></div><div class="nm"></div><div class="sc">0</div></div>
    <div class="vs">VS</div>
    <div class="pl" id="p1"><div class="disc y"></div><div class="nm"></div><div class="sc">0</div></div>
  </div>
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div class="btns">
    <button id="undoBtn">↶ Undo</button>
    <button id="hintBtn">💡 Hint</button>
    <button class="pri" id="newBtn">＋ New Match</button>
    <button id="sbBtn">🏆 Scoreboard</button>
    <button id="muteBtn">🔊</button>
  </div>
</div>

<div id="setup" class="modal hidden"><div class="card">
  <h2>New Match</h2>
  <div class="seg" id="modeSeg"><button data-v="cpu" class="on">vs Computer</button><button data-v="2p">2 Players</button></div>
  <div id="cpuOpts"><label>YOUR NAME</label><input id="nYou" maxlength="16" placeholder="Player">
    <div class="row"><div><label>DIFFICULTY</label><select id="lvl"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option><option value="3">Impossible</option></select></div>
    <div><label>YOU PLAY</label><select id="col"><option value="0">Red</option><option value="1">Yellow</option></select></div></div></div>
  <div id="pvpOpts" class="hidden"><div class="row"><div><label>RED</label><input id="n0" maxlength="16" placeholder="Player 1"></div><div><label>YELLOW</label><input id="n1" maxlength="16" placeholder="Player 2"></div></div></div>
  <div class="btns" style="margin-top:18px"><button id="cancel">Cancel</button><button class="pri" id="go">Start ▶</button></div>
</div></div>
<div id="sb" class="modal hidden"><div class="card">
  <h2>🏆 Scoreboard</h2>
  <table><thead><tr><th>#</th><th>PLAYER</th><th>W</th><th>D</th><th>L</th><th>WIN%</th></tr></thead><tbody id="sbBody"></tbody></table>
  <div style="margin-top:14px;font-size:12px;opacity:.6;letter-spacing:1px">RECENT GAMES</div><div class="recent" id="recent"></div>
  <div class="btns" style="margin-top:16px"><button id="sbReset">Reset</button><button class="pri" id="sbClose">Close</button></div>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const COLS=7,ROWS=6,COLORS=['#ff5a7a','#ffd23f'],DARK=['#c22d4f','#d9a300'];
const cv=$('c'),cx=cv.getContext('2d');let S=70,DPR=1,PAD=12;
function layout(){S=Math.floor(Math.min((innerWidth-30)/COLS,(innerHeight-300)/(ROWS+1),86));S=Math.max(38,S);DPR=Math.min(devicePixelRatio||1,2);
  cv.width=(COLS*S+PAD*2)*DPR;cv.height=((ROWS+1)*S+PAD*2)*DPR;cv.style.width=(COLS*S+PAD*2)+'px';cv.style.height=((ROWS+1)*S+PAD*2)+'px';cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',layout);layout();

/* audio */
let AC=null,muted=false;
function tone(f,d,v=.15,type='sine',dl=0){if(muted)return;if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}

/* scoreboard */
let SB=JSON.parse(localStorage.getItem('dropfour_scores')||'{"players":{},"games":[]}');
const saveSB=()=>localStorage.setItem('dropfour_scores',JSON.stringify(SB));
const rec=(n,k)=>{(SB.players[n]||(SB.players[n]={w:0,d:0,l:0}))[k]++;};

/* state */
const LV=['Easy','Normal','Hard','Impossible'];
let cfg=JSON.parse(localStorage.getItem('dropfour_cfg')||'{"mode":"cpu","you":"","lvl":1,"col":0,"n0":"","n1":""}');
let board,turn,hist,over,winLine,names,match={s:[0,0],d:0},starter=0,anim=[],hover=-1,busy=false,parts=[],hint=-1;
function setupNames(){
  if(cfg.mode==='cpu'){const you=(cfg.you||'Player').trim()||'Player',cpu='Computer · '+LV[cfg.lvl];names=cfg.col==0?[you,cpu]:[cpu,you];}
  else names=[(cfg.n0||'Player 1').trim()||'Player 1',(cfg.n1||'Player 2').trim()||'Player 2'];
}
function newRound(){
  board=Array.from({length:COLS},()=>[]);turn=starter;hist=[];over=false;winLine=null;anim=[];hint=-1;busy=false;
  updHud();maybeCpu();
}
function newMatch(){setupNames();match={s:[0,0],d:0};starter=0;newRound();}
const isCpu=p=>cfg.mode==='cpu'&&p!==+cfg.col;

/* rules */
function winner(b){
  const at=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS?b[c][r]:undefined;
  for(let c=0;c<COLS;c++)for(let r=0;r<b[c].length;r++){const p=b[c][r];
    for(const[dc,dr]of[[1,0],[0,1],[1,1],[1,-1]]){let k=1;while(k<4&&at(c+dc*k,r+dr*k)===p)k++;if(k===4)return{p,line:[0,1,2,3].map(i=>[c+dc*i,r+dr*i])};}}
  return null;
}
const full=b=>b.every(c=>c.length>=ROWS);

/* computer: alpha-beta with window heuristic */
const ORDER=[3,2,4,1,5,0,6];
function scoreWin(w,me){let m=0,o=0,e=0;for(const v of w){if(v===me)m++;else if(v===undefined)e++;else o++;}
  if(m===4)return 1000;if(m===3&&e===1)return 6;if(m===2&&e===2)return 2;if(o===3&&e===1)return-5;if(o===2&&e===2)return-1;return 0;}
function heur(b,me){
  let s=0;const at=(c,r)=>b[c][r];
  for(let r=0;r<ROWS;r++)if(b[3][r]===me)s+=3;else if(b[3][r]!==undefined)s-=3;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)for(const[dc,dr]of[[1,0],[0,1],[1,1],[1,-1]]){
    const ec=c+dc*3,er=r+dr*3;if(ec<0||ec>=COLS||er<0||er>=ROWS)continue;
    s+=scoreWin([at(c,r),at(c+dc,r+dr),at(c+dc*2,r+dr*2),at(ec,er)],me);}
  return s;
}
function negamax(b,depth,a,bt,p,ply){
  const w=winner(b);if(w)return w.p===p?100000-ply:-100000+ply;
  if(full(b))return 0;if(depth===0)return heur(b,p);
  for(const c of ORDER){if(b[c].length>=ROWS)continue;b[c].push(p);const v=-negamax(b,depth-1,-bt,-a,1-p,ply+1);b[c].pop();if(v>a)a=v;if(a>=bt)break;}
  return a;
}
function bestMove(p,lvl){
  const b=board.map(c=>c.slice());const depth=[2,4,6,8][lvl],noise=[60,8,0,0][lvl];
  // always take an immediate win / block at Normal+
  let best=-1,bs=-Infinity;
  for(const c of ORDER){if(b[c].length>=ROWS)continue;b[c].push(p);let v=-negamax(b,depth-1,-Infinity,noise||lvl===0?Infinity:-bs,1-p,1);b[c].pop();
    v+=(Math.random()*2-1)*noise;if(lvl===0&&Math.random()<.25)v+=Math.random()*200;
    if(v>bs){bs=v;best=c;}}
  return best;
}

/* moves */
function drop(c){
  if(over||busy||c<0||c>=COLS||board[c].length>=ROWS)return false;
  const r=board[c].length;board[c].push(turn);hist.push(c);hint=-1;
  anim.push({c,r,p:turn,y:PAD+S/2,vy:0,bounces:0});busy=true;tone(500+r*40,.08,.08,'triangle');
  return true;
}
function afterLand(){
  busy=false;
  const w=winner(board);
  if(w){over=true;winLine=w.line;match.s[w.p]++;const wn=names[w.p],ln=names[1-w.p];rec(wn,'w');rec(ln,'l');
    SB.games.unshift({a:names[0],b:names[1],r:wn+' won',t:Date.now()});SB.games=SB.games.slice(0,40);saveSB();
    msg(cfg.mode==='cpu'?(isCpu(w.p)?'Computer wins this round':'🎉 You win!'):`🎉 ${wn} wins!`);
    [523,659,784,1047].forEach((f,i)=>tone(f,.35,.12,'sine',i*.12));confetti(w.p);starter=1-starter;updHud(true);
    setTimeout(()=>{if(over)msg(msgEl.textContent+' — tap the board for the next round');},1400);return;}
  if(full(board)){over=true;match.d++;rec(names[0],'d');rec(names[1],'d');SB.games.unshift({a:names[0],b:names[1],r:'Draw',t:Date.now()});saveSB();msg('Board full — draw! Tap for next round');starter=1-starter;updHud(true);return;}
  turn=1-turn;updHud();maybeCpu();
}
function maybeCpu(){if(over||!isCpu(turn))return;busy=true;msg('Computer is thinking…');
  setTimeout(()=>{const c=bestMove(turn,+cfg.lvl);busy=false;drop(c);},380);}
const msgEl=$('msg');const msg=t=>msgEl.textContent=t;
function updHud(keepMsg){
  for(let i=0;i<2;i++){const e=$('p'+i);e.querySelector('.nm').textContent=names[i];e.querySelector('.sc').textContent=match.s[i];e.classList.toggle('turn',!over&&turn===i);}
  if(!keepMsg&&!over)msg(isCpu(turn)?'Computer is thinking…':`${names[turn]}'s turn`);
}
function confetti(p){for(let i=0;i<120;i++)parts.push({x:Math.random()*cv.clientWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,col:Math.random()<.6?COLORS[p]:'#fff',r:Math.random()*6.28,s:Math.random()*6+4,life:4});}

/* input */
function colAt(e){const r=cv.getBoundingClientRect();const x=(e.touches?e.touches[0]||e.changedTouches[0]:e).clientX-r.left-PAD;return Math.floor(x/S);}
cv.addEventListener('pointermove',e=>{hover=colAt(e);});
cv.addEventListener('pointerleave',()=>hover=-1);
cv.addEventListener('pointerdown',e=>{if(over&&!busy){newRound();return;}if(isCpu(turn))return;const c=colAt(e);hover=c;drop(c);});
addEventListener('keydown',e=>{if(/^[1-7]$/.test(e.key)&&!isCpu(turn)){if(over)newRound();else drop(+e.key-1);}});
$('undoBtn').onclick=()=>{if(busy||!hist.length)return;let n=cfg.mode==='cpu'?(isCpu(turn)&&!over?1:2):1;if(over)return;
  n=Math.min(n,hist.length);for(let i=0;i<n;i++){const c=hist.pop();board[c].pop();turn=1-turn;}hint=-1;updHud();maybeCpu();};
$('hintBtn').onclick=()=>{if(over||busy||isCpu(turn))return;hint=bestMove(turn,2);};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';};
$('newBtn').onclick=()=>{setSeg(cfg.mode);$('nYou').value=cfg.you;$('lvl').value=cfg.lvl;$('col').value=cfg.col;$('n0').value=cfg.n0;$('n1').value=cfg.n1;$('setup').classList.remove('hidden');};
function setSeg(v){cfg.mode=v;[...$('modeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('cpuOpts').classList.toggle('hidden',v!=='cpu');$('pvpOpts').classList.toggle('hidden',v==='cpu');}
$('modeSeg').onclick=e=>e.target.dataset.v&&setSeg(e.target.dataset.v);
$('cancel').onclick=()=>$('setup').classList.add('hidden');
$('go').onclick=()=>{Object.assign(cfg,{you:$('nYou').value,lvl:+$('lvl').value,col:+$('col').value,n0:$('n0').value,n1:$('n1').value});localStorage.setItem('dropfour_cfg',JSON.stringify(cfg));$('setup').classList.add('hidden');newMatch();};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('sbBtn').onclick=()=>{const rows=Object.entries(SB.players).map(([n,r])=>({n,...r,g:r.w+r.d+r.l})).sort((a,b)=>b.w-a.w||a.l-b.l);
  $('sbBody').innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.n)}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.g?Math.round(r.w/r.g*100):0}%</td></tr>`).join(''):'<tr><td colspan="6" style="opacity:.6;padding:16px">No games yet</td></tr>';
  $('recent').innerHTML=SB.games.map(g=>`<div><span>${esc(g.a)} vs ${esc(g.b)}</span><span>${esc(g.r)}</span></div>`).join('')||'—';$('sb').classList.remove('hidden');};
$('sbClose').onclick=()=>$('sb').classList.add('hidden');
$('sbReset').onclick=()=>{if(confirm('Reset all scores?')){SB={players:{},games:[]};saveSB();$('sbBtn').click();}};

/* render */
function discPath(x,y,r,col,dark){const g=cx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.18,col);g.addColorStop(1,dark);
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();cx.strokeStyle=dark;cx.lineWidth=r*.12;cx.beginPath();cx.arc(x,y,r*.68,0,Math.PI*2);cx.stroke();}
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;const T=now/1000;
  const w=COLS*S+PAD*2,h=(ROWS+1)*S+PAD*2;cx.clearRect(0,0,w,h);
  const top=S+PAD;
  // hover preview
  if(!over&&!busy&&hover>=0&&hover<COLS&&!isCpu(turn)&&board[hover].length<ROWS){cx.globalAlpha=.85;discPath(PAD+hover*S+S/2,PAD+S/2+Math.sin(T*5)*3,S*.4,COLORS[turn],DARK[turn]);cx.globalAlpha=1;}
  // landed discs
  for(let c=0;c<COLS;c++)for(let r=0;r<board[c].length;r++){if(anim.some(a=>a.c===c&&a.r===r))continue;discPath(PAD+c*S+S/2,top+(ROWS-1-r)*S+S/2,S*.4,COLORS[board[c][r]],DARK[board[c][r]]);}
  // falling discs
  for(let i=anim.length-1;i>=0;i--){const a=anim[i],ty=(ROWS-1-a.r)*S+S/2+top;a.vy+=S*60*dt;a.y+=a.vy*dt;
    if(a.y>=ty){a.y=ty;if(a.bounces<2&&a.vy>S*4){a.vy*=-.32;a.bounces++;tone(220,.06,.12,'triangle');}else{anim.splice(i,1);afterLand();continue;}}
    discPath(PAD+a.c*S+S/2,a.y,S*.4,COLORS[a.p],DARK[a.p]);}
  // board with holes
  cx.save();cx.beginPath();const rr=18;const bx=PAD-6,by=top-6,bw=COLS*S+12,bh=ROWS*S+12;
  cx.moveTo(bx+rr,by);cx.arcTo(bx+bw,by,bx+bw,by+bh,rr);cx.arcTo(bx+bw,by+bh,bx,by+bh,rr);cx.arcTo(bx,by+bh,bx,by,rr);cx.arcTo(bx,by,bx+bw,by,rr);
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const x=PAD+c*S+S/2,y=top+r*S+S/2;cx.moveTo(x+S*.42,y);cx.arc(x,y,S*.42,0,Math.PI*2,true);}
  const bg=cx.createLinearGradient(0,by,0,by+bh);bg.addColorStop(0,'#4b6fd8');bg.addColorStop(1,'#2d47a8');cx.fillStyle=bg;cx.fill('evenodd');
  cx.restore();
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const x=PAD+c*S+S/2,y=top+r*S+S/2;cx.strokeStyle='#ffffff22';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,S*.42,Math.PI*1.1,Math.PI*1.9);cx.stroke();cx.strokeStyle='#0003';cx.beginPath();cx.arc(x,y,S*.42,Math.PI*.1,Math.PI*.9);cx.stroke();}
  // column highlight & hint
  if(!over&&hover>=0&&hover<COLS&&!isCpu(turn)){cx.fillStyle='#ffffff10';cx.fillRect(PAD+hover*S,top-6,S,ROWS*S+12);}
  if(hint>=0){cx.strokeStyle='#fff';cx.setLineDash([6,6]);cx.lineWidth=3;cx.strokeRect(PAD+hint*S+3,top-3,S-6,ROWS*S+6);cx.setLineDash([]);cx.fillStyle='#fff';cx.font=`bold ${S*.35}px Segoe UI`;cx.textAlign='center';cx.fillText('▼',PAD+hint*S+S/2,PAD+S*.6);}
  // win line
  if(winLine){const p=winLine.map(([c,r])=>[PAD+c*S+S/2,top+(ROWS-1-r)*S+S/2]);
    p.forEach(([x,y])=>{cx.strokeStyle='#fff';cx.lineWidth=4;cx.shadowColor='#fff';cx.shadowBlur=18;cx.beginPath();cx.arc(x,y,S*.4+Math.sin(T*8)*3,0,Math.PI*2);cx.stroke();});
    cx.lineWidth=8;cx.lineCap='round';cx.beginPath();cx.moveTo(...p[0]);cx.lineTo(...p[3]);cx.stroke();cx.shadowBlur=0;}
  // confetti
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.r+=.1;q.life-=dt;if(q.life<=0||q.y>h+20){parts.splice(i,1);continue;}
    cx.save();cx.translate(q.x,q.y);cx.rotate(q.r);cx.fillStyle=q.col;cx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);cx.restore();}
  requestAnimationFrame(frame);
}
newMatch();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
